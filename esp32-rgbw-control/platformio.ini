[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    fastled/FastLED@^3.5.0
    bblanchon/ArduinoJson@^6.21.3
    Links2004/WebSockets@^2.3.7

build_flags =
    -D LED_PIN=7
    -D LED_COUNT=30
    -D LED_BRIGHTNESS=255
    -D WIFI_MODE=1
    -D AP_SSID="ESP32-RGBW"
    -D AP_PASSWORD="12345678"
    -D STATION_SSID="YourRouterSSID"
    -D STATION_PASSWORD="YourRouterPassword"
    -D SERVER_PORT=8080
    -D MDNS_NAME="esp32-rgbw"
    -Iinclude

build_dir = build
lib_dir = lib
src_dir = src
